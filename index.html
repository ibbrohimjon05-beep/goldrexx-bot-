<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GOLDREX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--g1:#ffe27a;--g2:#f5b31b;--g3:#b9770e;--line:#c98a14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:#f6e7b8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(ellipse at 50% 0,#3d2706 0,#0b0803 55%,#000 100%)}
#view{position:absolute;inset:0;overflow-y:auto;padding:max(10px,env(safe-area-inset-top)) 12px 24px}
button{font-family:inherit;cursor:pointer}
.card{border:1.5px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#1d1507,#0a0702);box-shadow:inset 0 0 18px #f5b31b22,0 0 12px #f5b31b1c;padding:10px;margin-bottom:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:800;color:#2a1700;
background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 0 14px #f5b31b66,inset 0 1px 0 #fff9}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px}
.btn.dark{background:linear-gradient(#2c1e08,#120c03);color:var(--g1);border:1.5px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(#ff8a7a,#c0281a);color:#fff}
.btn:disabled{opacity:.5}
.gold{background:linear-gradient(180deg,var(--g1),var(--g2) 60%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:20px;font-weight:800}
.hdr .bk{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#150f04;color:var(--g1);font-size:18px}
.sub{text-align:center;font-size:14px;margin-bottom:10px;color:#f1dca0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gb{padding:10px 4px;text-align:center;font-size:13px;font-weight:700;color:var(--g1);border:1.5px solid var(--line);border-radius:12px;background:linear-gradient(#1f1608,#0b0802)}
.gb i{display:block;font-style:normal;font-size:24px}
.lion{position:relative;text-align:center;height:150px}
.lion img{height:150px;filter:drop-shadow(0 0 18px #f5b31b99)}
.lion .le{font-size:100px;line-height:1.1;filter:drop-shadow(0 0 20px #f5b31bcc)}.lion .cr{position:absolute;left:0;right:0;top:-6px;font-size:44px;filter:drop-shadow(0 0 10px #f5b31b)}
.logo{text-align:center;font-size:44px;font-weight:900;letter-spacing:2px;line-height:1;margin-top:-6px;filter:drop-shadow(0 2px 6px #000)}
.tag{text-align:center;font-size:14px;font-weight:700;color:var(--g2);margin:4px 0 12px}
.prof{display:flex;align-items:center;gap:10px}.av{width:54px;height:54px;border-radius:50%;border:2px solid var(--g2);background:#2a1c06 center/cover;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--g1);flex:none}
.shield{width:54px;height:62px;flex:none;clip-path:polygon(50% 0,100% 14%,100% 60%,50% 100%,0 60%,0 14%);background:linear-gradient(#ffe27a,#b9770e);display:flex;align-items:center;justify-content:center}
.shield div{width:46px;height:54px;clip-path:inherit;background:linear-gradient(#2b1d07,#0c0802);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:var(--g1);font-size:19px;line-height:1}
.shield small{font-size:9px}
.bal{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:800}
.plus{width:30px;height:30px;border:0;border-radius:8px;background:linear-gradient(var(--g1),var(--g3));font-weight:900;font-size:20px;color:#2a1700}
.online{text-align:center;margin:8px 0;font-weight:700}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2ee62e;box-shadow:0 0 8px #2ee62e;margin-right:6px}
.play{font-size:26px;padding:14px;margin:6px 0 10px;letter-spacing:2px}
.foot{text-align:center;font-weight:700;font-size:13px;padding:8px;border:1.5px solid var(--line);border-radius:12px;background:#120c03}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{text-align:center;padding:10px 4px;font-weight:800;font-size:18px;position:relative}.gc .ic{font-size:64px;line-height:1.15;filter:drop-shadow(0 0 10px #f5b31b88)}.gc small{display:block;font-size:12px;font-weight:600;color:#f1dca0}
.gc.off{opacity:.35}
.chk div{padding:3px 0;font-size:14px}.chk div:before{content:"✔ ";color:#3be63b;font-weight:900}
.item{display:flex;align-items:center;gap:10px;padding:10px}.item .t{flex:1;font-weight:700}.item .t small{display:block;font-weight:500;color:#e5cf92;font-size:12px}
.pill{font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px 2px;border-radius:10px;border:1.5px solid var(--line);background:#150f04;color:var(--g1);font-weight:700;font-size:13px}.tabs button.on{background:linear-gradient(var(--g1),var(--g3));color:#2a1700}
input,textarea,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1.5px solid var(--line);background:#0e0902;color:#fbeab5;font-size:16px;user-select:text}
.ov{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.ov .box{width:100%;max-width:420px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d1507;border:1.5px solid var(--g2);color:var(--g1);padding:10px 16px;border-radius:12px;z-index:99;font-weight:700;max-width:90%}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stk .btn{font-size:18px}.stk small{display:block;font-size:11px;font-weight:600}
.pl{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:6px auto;width:min(94vw,58vh);border:1.5px solid var(--line);border-radius:12px;background:#120c03}
.pl.act{box-shadow:0 0 14px #f5b31b;border-color:var(--g1)}.pl b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pl .av{width:34px;height:34px;font-size:14px}
.clk{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:#7dff7d}.clk.low{color:#ff6a5a}
.mv{text-align:center;margin:6px 0;font-weight:700}
.chess,.dr{width:min(94vw,58vh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);margin:auto;border:3px solid var(--line);border-radius:6px;box-shadow:0 0 18px #f5b31b55;overflow:hidden}
.cl{display:flex;align-items:center;justify-content:center;position:relative}.cl.l{background:#f0d9b5}.cl.d{background:#b58863}
.cl.sel{background:#f5d442!important}.cl.last{box-shadow:inset 0 0 0 100px #ffee0055}.cl.chk{background:#ff4a3a!important}
.cl.t:after{content:"";width:28%;height:28%;border-radius:50%;background:#1a8a2eaa;position:absolute}.cl.tc:after{width:86%;height:86%;background:none;border:4px solid #1a8a2eaa;border-radius:50%}
.pc{font-size:min(10.5vw,6.6vh);line-height:1;z-index:1}.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 1px #000}.pc.b{color:#161616;text-shadow:0 0 1px #fff9}
.dr .cl.l{background:#e8cf9e}.dr .cl.d{background:#7a4a22}
.ck{width:78%;height:78%;border-radius:50%;box-shadow:0 3px 5px #0009;position:relative}.ck.w{background:radial-gradient(circle at 35% 30%,#fff,#d8d0c0 60%,#a89f8c)}.ck.b{background:radial-gradient(circle at 35% 30%,#666,#1a1a1a 60%,#000)}
.ck.k:after{content:"♛";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(6vw,3.6vh);color:#e0a010}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px;margin:auto;width:min(94vw,50vh);background:linear-gradient(#2a62ea,#1238a8);border-radius:14px;border:3px solid var(--line)}
.hole{aspect-ratio:1;border-radius:50%;background:#071a55;box-shadow:inset 0 3px 6px #000}.hole.r{background:radial-gradient(circle at 35% 30%,#ff9a9a,#e01010)}.hole.y{background:radial-gradient(circle at 35% 30%,#fff3a0,#f0b800)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#000}
#hud{position:absolute;left:10px;top:max(10px,env(safe-area-inset-top));right:10px;pointer-events:none;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 0 6px #000}
#hud .lb{font-size:12px;text-align:right}#hud .big{font-size:20px;color:var(--g1)}
#snbar{position:absolute;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom))}
.big-emoji{font-size:70px;text-align:center}
</style>
</head>
<body>
<div id="view"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:{initData:'',expand(){},ready(){}};
tg.ready();tg.expand();try{tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
const $=s=>document.querySelector(s),fmt=n=>Number(n).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
async function api(p,body){const o={headers:{'X-Init':tg.initData,'Content-Type':'application/json'}};if(body!==undefined){o.method='POST';o.body=JSON.stringify(body)}const r=await fetch(p,o);if(!r.ok)throw new Error(r.status);return r.json()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function view(h){const v=$('#view');v.style.padding='';v.innerHTML=h;v.scrollTop=0}
function ov(h){closeOv();const d=document.createElement('div');d.className='ov';d.id='ov';d.innerHTML='<div class="box card">'+h+'</div>';document.body.appendChild(d)}
function closeOv(){const o=$('#ov');if(o)o.remove()}
const hdr=(t,b='back()')=>`<div class="hdr"><button class="bk" onclick="${b}">‹</button><span class="gold">${t}</span></div>`;
let ME=null,cur={name:'home'},stack=[],G={chat:[]},ws=null,tick=null;
function go(n,a){if(cur)stack.push(cur);cur={name:n,arg:a};render()}
function back(){cur=stack.pop()||{name:'home'};render()}
function render(){clearInterval(tick);G.raf=0;(V[cur.name]||V.home)(cur.arg)}
async function loadMe(){ME=await api('/api/me')}
const tu=()=>(tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
const avatar=(n,photo)=>`<div class="av" ${photo?`style="background-image:url(${photo})"`:''}>${photo?'':esc((n||'?')[0])}</div>`;
const GAMES={chess:['♟','Shaxmat','10 min • 1 min'],dr:['⚪','Shashka','6 min • 1 min'],c4:['🔴','4 Ta Tosh','6 min • 1 min'],sn:['🐍','Snake Lite',"5 min • 5–10 o'yinchi"]};

/* ---------------- WebSocket ---------------- */
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?init='+encodeURIComponent(tg.initData));
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>setTimeout(connect,1500);
}
const wsend=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function enterGame(){if(cur.name!=='game'){stack=[{name:'home'}];cur={name:'game'};render()}}
function onMsg(m){
  if(m.t==='hello'||m.t==='online'){const n=m.online||m.n;if(ME)ME.online=n;const el=$('#onl');if(el)el.textContent=n}
  else if(m.t==='queued')ov(`<div class="big-emoji">🔎</div><div class="sub">Raqib qidirilmoqda...<br><b>${GAMES[m.game][1]} • ${fmt(m.stake)} 🪙</b></div><button class="btn dark" onclick="wsend({t:'cancel'})">❌ Bekor qilish</button>`);
  else if(m.t==='cancelled'||m.t==='lobby_cancel'){closeOv();if(m.t==='lobby_cancel')toast("Yetarli o'yinchi yig'ilmadi, tanga qaytarildi")}
  else if(m.t==='lobby')ov(`<div class="big-emoji">🐍</div><div class="sub"><b>Snake Lite • ${fmt(m.stake)} 🪙</b><br>O'yinchilar: <b>${m.n}/${m.max}</b> (kamida ${m.min})<br>${m.cd>=0?`Boshlanishiga: <b>${m.cd}</b> s`:`Yana ${Math.max(0,m.min-m.n)} ta o'yinchi kerak<br><small>Kutish: ${mmss(m.wait)}</small>`}</div><button class="btn dark" onclick="wsend({t:'cancel'})">❌ Chiqish</button>`);
  else if(m.t==='state'){closeOv();G.s=m;G.sn=null;G.at=Date.now();if(cur.name!=='game'){G.sel=null;enterGame()}else{if(!m.over||true)drawGame()}}
  else if(m.t==='snstart'){closeOv();G.s=null;snInit(m);enterGame()}
  else if(m.t==='sn')snUpdate(m);
  else if(m.t==='end')showEnd(m);
  else if(m.t==='err'){closeOv();toast(m.m)}
  else if(m.t==='chat'){G.chat.push(m);if(cur.name==='chat')drawChat()}
  else if(m.t==='chat_hist'){G.chat=m.m;if(cur.name==='chat')drawChat()}
}
function showEnd(m){
  G.fin=true;loadMe().catch(()=>{});
  const icon=m.res==='win'?'🏆':m.res==='draw'?'🤝':'💔',tx=m.res==='win'?"G'ALABA!":m.res==='draw'?'DURANG':'YUTQAZDINGIZ';
  let extra=m.prize?`<div class="sub gold" style="font-size:26px;font-weight:900">+${fmt(m.prize)} 🪙</div>`:'';
  if(m.top)extra+=`<div class="sub">Siz ${m.rank}-o'rin</div>`+m.top.slice(0,5).map((r,i)=>`<div class="item card" style="margin-bottom:4px"><span>${i+1}.</span><span class="t">${esc(r.n)}<small>${r.s} ochko</small></span><b>${r.p?'+'+fmt(r.p):''}</b></div>`).join('');
  setTimeout(()=>ov(`<div class="big-emoji">${icon}</div><div class="hdr gold" style="justify-content:center;font-size:26px">${tx}</div>${m.why?`<div class="sub">${esc(m.why)}</div>`:''}${extra}<button class="btn" onclick="closeOv();stack=[];go('games')">🎮 Yana o'ynash</button><div style="height:8px"></div><button class="btn dark" onclick="closeOv();stack=[];cur={name:'home'};render()">🏠 Menyu</button>`),G.sn?600:300);
}

/* ---------------- Views ---------------- */
const V={};
V.home=async()=>{
  try{await loadMe()}catch(e){return view('<div class="sub">Telegram ichida oching 🙂</div>')}
  if(ME.need_sub.length)return V.gate();
  const u=ME.user,t=tu();
  view(`<div class="lion"><div class="cr">👑</div><img src="/static/lion.png" onerror="this.remove()"><div class="le" id="le">🦁</div></div>
  <div class="logo gold">GOLDREX</div><div class="tag">O'yin • Do'stlik • G'alaba</div>
  <div class="card prof">${avatar(u.name,t.photo_url)}<div style="flex:1"><b style="font-size:18px">${esc(u.name)} <span style="color:#4ab8ff">✔</span></b><div style="font-size:13px;opacity:.8">ID: ${u.id}</div></div>
   <div class="shield"><div>${ME.level}<small>LVL</small></div></div></div>
  <div class="row2"><div class="card bal"><span>🪙 ${fmt(u.coins)}</span><button class="plus" onclick="go('deposit')">+</button></div>
   <div class="card bal"><span>💎 ${fmt(u.wins)}</span><button class="plus" onclick="go('rating')">›</button></div></div>
  <div class="online"><span class="dot"></span>Online: <span id="onl">${ME.online}</span></div>
  <button class="btn play" onclick="go('games')">▶ O'YNASH</button>
  <div class="grid3"><div class="gb" onclick="go('shop')"><i>🛒</i>Do'kon</div><div class="gb" onclick="go('tasks')"><i>📋</i>Vazifalar</div><div class="gb" onclick="go('rating')"><i>🏆</i>Reyting</div>
  <div class="gb" onclick="go('chat')"><i>💬</i>Chat</div><div class="gb" onclick="go('profile')"><i>👤</i>Profil</div><div class="gb" onclick="go('more')"><i>⋯</i>Boshqa</div></div>
  <div class="foot" style="margin-top:10px">👑 GOLDREX – Eng zo'r o'yin platformasi!</div>`);
};
V.gate=()=>view(`<div class="logo gold" style="margin-top:20px">GOLDREX</div><div class="sub" style="margin-top:14px">❗ Botdan foydalanish uchun kanallarga obuna bo'ling</div>
 ${ME.need_sub.map(c=>`<div class="card item"><span class="t">📢 ${esc(c.title)}</span><button class="btn sm" onclick="openL('${esc(c.url)}')">Obuna</button></div>`).join('')}
 <button class="btn" onclick="render()">✅ Tekshirish</button>`);
function openL(u){u.includes('t.me')&&tg.openTelegramLink?tg.openTelegramLink(u):(tg.openLink?tg.openLink(u):window.open(u))}
V.more=()=>view(hdr('Boshqa')+`<div class="card item" onclick="go('deposit')"><span style="font-size:26px">💰</span><span class="t">Depozit<small>Tanga sotib olish</small></span>›</div>
 <div class="card item" onclick="go('withdraw')"><span style="font-size:26px">💸</span><span class="t">Pul chiqarish<small>Minimal ${fmt(ME.cfg.min_withdraw)} tanga</small></span>›</div>
 ${ME.admin?`<div class="card item" onclick="go('admin')"><span style="font-size:26px">👑</span><span class="t">Admin panel</span>›</div>`:''}`);
V.games=()=>view(hdr("O'yinlar",'cur={name:\'home\'};stack=[];render()')+`<div class="card sub" style="font-weight:700">🏆 O'zingizga yoqqan o'yinni tanlang va tikish bilan o'ynang!</div>
 <div class="gcards">${Object.entries(GAMES).map(([k,g])=>`<div class="card gc ${ME.cfg['on_'+k]?'':'off'}" onclick="pick('${k}')"><div class="ic">${g[0]}</div>${g[1]}<small>${g[2]}</small></div>`).join('')}</div>
 <div class="card chk"><div>Barcha o'yinlarda tanga tikiladi!</div><div>G'olib jamg'armaning ${ME.cfg.win_share}% ini oladi!</div><div>Durang bo'lsa, tanga qaytariladi!</div><div>Snake Lite: eng ko'p ball to'plagan TOP-3 yutadi!</div></div>`);
function pick(g){
  if(!ME.cfg['on_'+g])return toast("Bu o'yin hozircha o'chirilgan");
  const sh=ME.cfg.win_share;
  ov(`<div class="hdr gold" style="justify-content:center">${GAMES[g][0]} ${GAMES[g][1]}</div><div class="sub">Tikishni tanlang<br>${g==='sn'?`Top-3 bankning ${sh}% ini bo'lishadi (50/30/20)`:`G'olib bankning ${sh}% ini oladi`}</div>
  <div class="stk">${ME.stakes.map(s=>`<button class="btn" onclick="play('${g}',${s})">🪙 ${fmt(s)}<small>${g==='sn'?'':'yutuq: '+fmt(Math.floor(s*2*sh/100))}</small></button>`).join('')}</div><button class="btn dark" onclick="closeOv()">Yopish</button>`);
}
function play(g,s){if(ME.user.coins<s)return toast('Tanga yetarli emas — depozit qiling');closeOv();wsend({t:'queue',game:g,stake:s})}
V.rating=async(k='coins')=>{
  const r=await api('/api/rating?kind='+k);
  view(hdr('Reyting')+`<div class="tabs">${[['coins','🪙 Tanga'],['level','🛡 Daraja'],['wins',"🏆 G'alaba"]].map(([a,b])=>`<button class="${a===k?'on':''}" onclick="V.rating('${a}')">${b}</button>`).join('')}</div>
  ${r.rows.map((x,i)=>`<div class="card item"><b style="width:28px">${['🥇','🥈','🥉'][i]||i+1}</b><span class="t">${esc(x.name)}</span><b class="gold" style="font-size:18px">${fmt(x.val)}</b></div>`).join('')}
  <div class="card item" style="border-color:var(--g1)"><b>Siz:</b><span class="t">${esc(ME.user.name)}</span><b>${r.me}-o'rin</b></div>`);
};
V.profile=async()=>{
  await loadMe();const u=ME.user,d=new Date(u.joined*1000).toLocaleString();
  view(hdr('Profil')+`<div class="card prof">${avatar(u.name,tu().photo_url)}<div style="flex:1"><b>${esc(u.name)}</b><div style="font-size:13px;opacity:.8">ID: ${u.id}</div></div><div class="shield"><div>${ME.level}<small>LVL</small></div></div></div>
  <div class="card" style="line-height:2">📅 Botga kirgan: <b>${d}</b><br>🪙 Tanga: <b>${fmt(u.coins)}</b><br>🏆 Yutgan: <b>${u.wins}</b><br>💔 Yutqazgan: <b>${u.losses}</b><br>➕ Depozit: <b>${fmt(u.deposited)} so'm</b><br>➖ Chiqarilgan: <b>${fmt(u.withdrawn)} tanga (${fmt(u.withdrawn*ME.cfg.coin_som)} so'm)</b><br>👥 Taklif qilganlar: <b>${u.refs}</b></div>
  <div class="card"><div style="font-size:13px;word-break:break-all">${esc(ME.ref_link)}</div><button class="btn dark" style="margin-top:8px" onclick="navigator.clipboard&&navigator.clipboard.writeText('${ME.ref_link}');toast('Nusxalandi')">📋 Havolani nusxalash</button></div>`);
};
V.shop=async()=>{

V.game=()=>{
  if(G.sn)return snView();
  view(`<div id="g"></div>`);drawGame();tick=setInterval(clocks,250);
};
function drawGame(){
  const s=G.s;if(!s||cur.name!=='game'||G.sn)return;const me=s.you,op=1-me;
  const pb=(i,id,top)=>`<div class="pl ${s.turn===i&&!s.over?'act':''}">${avatar(s.names[i],i===me?tu().photo_url:'')}<b>${esc(s.names[i])}${i===me?' (Siz)':''}</b><span class="clk" id="${id}">--:--</span></div>`;
  let b=s.game==='chess'?chessHtml(s):s.game==='dr'?drHtml(s):c4Html(s);
  $('#g').innerHTML=`<div class="hdr" style="justify-content:center;margin:2px 0"><span class="gold">${GAMES[s.game][0]} ${GAMES[s.game][1]}</span><span class="pill">🪙 ${fmt(s.stake)}</span></div>
  ${pb(op,'c1')}${b}${pb(me,'c0')}<div class="mv">⏱ Yurish uchun: <b id="mv">1:00</b></div>
  <div class="row2" style="width:min(94vw,58vh);margin:auto"><button class="btn dark" onclick="if(confirm('Taslim bo\\'lasizmi?'))wsend({t:'resign'})">🏳 Taslim bo'lish</button><button class="btn dark" onclick="go('chat')">💬 Chat</button></div>`;
  clocks();
}
function clocks(){
  const s=G.s;if(!s||G.sn)return;const e=s.over?0:(Date.now()-G.at)/1000;
  [0,1].forEach(i=>{const el=document.getElementById(i===s.you?'c0':'c1');if(el){const v=s.clock[i]-(i===s.turn?e:0);el.textContent=mmss(v);el.classList.toggle('low',v<30)}});
  const m=$('#mv');if(m)m.textContent=s.over?'—':mmss(s.mv-e)
}
const GL={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function chessHtml(s){
  const w=s.you===0,bd=s.fen.split(' ')[0].split('/').map(r=>{const o=[];for(const ch of r)/\d/.test(ch)?o.push(...Array(+ch).fill('')):o.push(ch);return o});
  const tg_=G.sel&&s.lm[G.sel]?s.lm[G.sel]:[];let h='<div class="chess">';
  for(let ri=0;ri<8;ri++)for(let fi=0;fi<8;fi++){
    const R=w?ri:7-ri,F=w?fi:7-fi,p=bd[R][F],sq='abcdefgh'[F]+(8-R);
    let c='cl '+((R+F)%2?'d':'l');if(sq===G.sel)c+=' sel';if(s.last&&s.last.includes(sq))c+=' last';
    if(tg_.includes(sq))c+=p?' tc':' t';if(s.check&&p&&p.toLowerCase()==='k'&&(p===p.toUpperCase())===(s.turn===0))c+=' chk';
    h+=`<div class="${c}" onclick="cc('${sq}')">${p?`<span class="pc ${p===p.toUpperCase()?'w':'b'}">${GL[p.toLowerCase()]}&#xFE0E;</span>`:''}</div>`}
  return h+'</div>';
}
function cc(sq){const s=G.s;if(!s||s.over||s.turn!==s.you)return;
  if(G.sel&&(s.lm[G.sel]||[]).includes(sq)){wsend({t:'move',from:G.sel,to:sq});G.sel=null;return}
  G.sel=s.lm[sq]?sq:null;drawGame()}
function drHtml(s){
  const w=s.you===0,lm={};s.lm.forEach(m=>{(lm[m[0]+','+m[1]]=lm[m[0]+','+m[1]]||[]).push(m[2]+','+m[3])});
  if(s.chain&&s.turn===s.you)G.sel=s.chain[0]+','+s.chain[1];
  const tgs=G.sel&&lm[G.sel]?lm[G.sel]:[];let h='<div class="dr">';
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const r=w?i:7-i,c=w?j:7-j,v=s.b[r][c],k=r+','+c;let cl='cl '+((r+c)%2?'d':'l');if(k===G.sel)cl+=' sel';if(tgs.includes(k))cl+=' t';
    h+=`<div class="${cl}" onclick="dc(${r},${c})">${v?`<div class="ck ${v>0?'w':'b'} ${Math.abs(v)===2?'k':''}"></div>`:''}</div>`}
  return h+'</div>';
}
function dc(r,c){const s=G.s;if(!s||s.over||s.turn!==s.you)return;const k=r+','+c,lm={};s.lm.forEach(m=>{(lm[m[0]+','+m[1]]=lm[m[0]+','+m[1]]||[]).push(m[2]+','+m[3])});
  if(G.sel&&(lm[G.sel]||[]).includes(k)){const f=G.sel.split(',').map(Number);G.sel=null;wsend({t:'move',f,to:[r,c]});return}
  if(!s.chain)G.sel=lm[k]?k:null;drawGame()}
function c4Html(s){let h='<div class="c4">';for(let r=0;r<6;r++)for(let c=0;c<7;c++){const v=s.b[r][c];h+=`<div class="hole ${v===1?'r':v===2?'y':''}" onclick="c4m(${c})"></div>`}return h+'</div>'}
function c4m(c){const s=G.s;if(s&&!s.over&&s.turn===s.you)wsend({t:'move',col:c})}

/* ---------------- Snake Lite (aylana arena) ---------------- */
const COL=['#ffd24a','#ff5a4a','#4ac8ff','#7dff6a','#c06bff','#ff8fd0','#ffa03a','#3affd0','#f2f2f2','#9a9aff'];
function snInit(m){G.sn={you:m.you,names:m.names,R:m.R,food:new Map(m.food.map(f=>[f[0],f])),sn:[],disp:[],left:m.dur,go:3,cam:null,last:0};G.fin=false}
function snUpdate(m){
  const S=G.sn;if(!S)return;S.left=m.left;S.go=m.go;
  m.s.forEach((z,i)=>{S.sn[i]={alive:z[0],score:z[1],x:z[2],y:z[3],a:z[4],pts:z[5]};
    const d=S.disp[i];if(!d||d.length!==z[5].length)S.disp[i]=z[5].slice()});
  (m.ff?(S.food=new Map(m.ff.map(f=>[f[0],f]))):0);m.fa.forEach(f=>S.food.set(f[0],f));m.fr.forEach(i=>S.food.delete(i));
  const lb=$('#lb');if(lb){const o=S.sn.map((z,i)=>[i,z]).sort((a,b)=>b[1].score-a[1].score);
    lb.innerHTML=o.slice(0,5).map(([i,z],r)=>`<div style="color:${z.alive?COL[i]:'#777'}">${r+1}. ${esc(S.names[i])} ${z.score}</div>`).join('');
    $('#sc').textContent='🍎 '+S.sn[S.you].score;$('#tm').textContent='⏱ '+mmss(S.left);$('#al').textContent='🐍 '+S.sn.filter(z=>z.alive).length+' tirik'}
}
function snView(){
  view('');const v=$('#view');v.style.padding='0';
  v.innerHTML=`<canvas id="cv"></canvas><div id="hud"><div><div class="big" id="sc">🍎 0</div><div id="tm">⏱</div><div id="al"></div></div><div class="lb" id="lb"></div></div>
  <div id="snbar"><button class="btn dark" onclick="if(confirm('Chiqasizmi? (yutqazasiz)'))wsend({t:'resign'})">🏳 Chiqish</button></div>`;
  const cv=$('#cv'),dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
  let lastSend=0;const aim=e=>{const r=cv.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left-r.width/2,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top-r.height/2;
    const n=Date.now();if(n-lastSend>55){lastSend=n;wsend({t:'angle',a:Math.atan2(y,x)})}e.preventDefault()};
  ['pointerdown','pointermove'].forEach(ev=>cv.addEventListener(ev,aim,{passive:false}));
  const loop=()=>{if(cur.name!=='game'||!G.sn)return;snDraw(cv);requestAnimationFrame(loop)};requestAnimationFrame(loop);
}
function snDraw(cv){
  const S=G.sn,x=cv.getContext('2d'),W=cv.width,H=cv.height,sc=W/620;
  x.fillStyle='#000';x.fillRect(0,0,W,H);if(!S.sn.length)return;
  S.disp.forEach((d,i)=>{const t=S.sn[i].pts;for(let k=0;k<d.length;k++)d[k]+=(t[k]-d[k])*.45});
  const me=S.sn[S.you];let tg_=null;
  if(me&&me.alive)tg_=[S.disp[S.you][0],S.disp[S.you][1]];else{let b=-1;S.sn.forEach((z,i)=>{if(z.alive&&z.score>b){b=z.score;tg_=[S.disp[i][0],S.disp[i][1]]}})}
  tg_=tg_||[0,0];if(!S.cam)S.cam=tg_.slice();S.cam[0]+=(tg_[0]-S.cam[0])*.2;S.cam[1]+=(tg_[1]-S.cam[1])*.2;
  x.save();x.translate(W/2,H/2);x.scale(sc,sc);x.translate(-S.cam[0],-S.cam[1]);
  const g=x.createRadialGradient(0,0,0,0,0,S.R);g.addColorStop(0,'#2e1e06');g.addColorStop(1,'#140d03');
  x.beginPath();x.arc(0,0,S.R,0,7);x.fillStyle=g;x.fill();
  x.save();x.clip();x.strokeStyle='#f5b31b14';x.lineWidth=1.5;for(let k=-S.R;k<=S.R;k+=70){x.beginPath();x.moveTo(k,-S.R);x.lineTo(k,S.R);x.moveTo(-S.R,k);x.lineTo(S.R,k);x.stroke()}x.restore();
  x.shadowColor='#ffb300';x.shadowBlur=30;x.lineWidth=16;x.strokeStyle='#f5b31b';x.beginPath();x.arc(0,0,S.R+8,0,7);x.stroke();x.shadowBlur=0;
  S.food.forEach(f=>{x.fillStyle=COL[f[0]%10];x.shadowColor=x.fillStyle;x.shadowBlur=8;x.beginPath();x.arc(f[1],f[2],f[3]>1?6:4.5,0,7);x.fill()});x.shadowBlur=0;
  S.sn.forEach((z,i)=>{if(!z.alive)return;const d=S.disp[i];x.fillStyle=COL[i];
    for(let k=d.length-2;k>=0;k-=2){x.globalAlpha=.55+.45*(1-k/d.length);x.beginPath();x.arc(d[k],d[k+1],k?8.5:10,0,7);x.fill()}x.globalAlpha=1;
    const a=z.a,hx=d[0],hy=d[1];x.fillStyle='#fff';[-.6,.6].forEach(o=>{x.beginPath();x.arc(hx+Math.cos(a+o)*6,hy+Math.sin(a+o)*6,3.2,0,7);x.fill()});
    x.fillStyle='#000';[-.6,.6].forEach(o=>{x.beginPath();x.arc(hx+Math.cos(a+o)*7+Math.cos(a)*1.3,hy+Math.sin(a+o)*7+Math.sin(a)*1.3,1.6,0,7);x.fill()});
    x.font='bold 13px sans-serif';x.textAlign='center';x.fillStyle=i===S.you?'#ffe27a':'#fff';x.fillText(S.names[i].slice(0,12),hx,hy-18)});
  x.restore();
  x.font='900 90px sans-serif';x.textAlign='center';x.fillStyle='#ffe27a';x.shadowColor='#000';x.shadowBlur=10;
  if(S.go>0)x.fillText(S.go,W/2,H/2);else if(me&&!me.alive){x.font='800 26px sans-serif';x.fillText("💀 Siz o'ldingiz — tomosha",W/2,H*.25)}x.shadowBlur=0;
}

  view(hdr("O'yin sozlamalari")+Object.keys(L).map(k=>`<div class="card"><small>${L[k]}</small><input id="s_${k}" type="number" value="${s[k]}"></div>`).join('')+`<button class="btn" onclick="saveSet('${Object.keys(L).join()}')">💾 Saqlash</button>`);
};
async function saveSet(ks){const b={};ks.split(',').forEach(k=>b[k]=$('#s_'+k).value);await api('/api/admin/settings',b);toast('Saqlandi ✅')}
V.adm_deps=async()=>{
  const r=await api('/api/admin/deposits'),cards=await api('/api/admin/list/cards');
  view(hdr('Depozitlar')+`<div class="card"><b class="gold">💳 To'lov kartalari</b>${cards.map(c=>`<div class="item" style="padding:4px 0"><span class="t" style="white-space:pre-wrap">${esc(c.info)}</span><button class="btn sm red" onclick="adel('cards',${c.id})">🗑</button></div>`).join('')}<input id="f_info" placeholder="Karta raqami + egasi"><button class="btn" onclick="G.defs={};cadd('cards','info')">Karta qo'shish</button></div>`+
  r.map(d=>`<div class="card"><b>#${d.id} ${esc(d.name)}</b> <span class="pill">${d.status}</span><br>${fmt(d.som)} so'm → ${fmt(d.coins)} tanga ${d.status==='new'?`<div class="row2" style="margin-top:6px"><button class="btn sm dark" onclick="rcpt(${d.id})">🧾 Chek</button><span></span><button class="btn sm" onclick="dec('deposit',${d.id},true)">✅ Tasdiq</button><button class="btn sm red" onclick="dec('deposit',${d.id},false)">❌ Rad</button></div>`:''}</div>`).join(''));
};
const rcpt=id=>ov(`<img src="/api/admin/receipt/${id}?init=${encodeURIComponent(tg.initData)}" style="width:100%;border-radius:10px"><button class="btn dark" style="margin-top:8px" onclick="closeOv()">Yopish</button>`);
async function dec(k,id,ok){const r=await api('/api/admin/'+k,{id,ok});toast(r.ok?'Bajarildi ✅':"Ko'rib chiqilgan");render()}
V.adm_wds=async()=>{
  const r=await api('/api/admin/withdraws');
  view(hdr('Pul chiqarishlar')+r.map(w=>`<div class="card"><b>#${w.id} ${esc(w.name)}</b> <span class="pill">${w.status}</span><br>${fmt(w.coins)} tanga = ${fmt(w.som)} so'm<br>💳 <span style="user-select:text">${esc(w.card)}</span>${w.status==='new'?`<div class="row2" style="margin-top:6px"><button class="btn sm" onclick="dec('withdraw',${w.id},true)">✅ To'landi</button><button class="btn sm red" onclick="dec('withdraw',${w.id},false)">❌ Rad</button></div>`:''}</div>`).join(''));
};

connect();render();
</script>
</body>
</html>
